# Reusable build: tests, artifact, distribution folder.
#
# Called by ci.yml (branches, pull requests) and release.yml (tags, main).
# Everything runs in Windows PowerShell 5.1 because that is the supported host
# of the artifact - a green build here must mean a working `irm | iex` run.

name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version to embed; empty reads VERSION
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: Version embedded in the artifact
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: Name of the uploaded distribution artifact
        value: ghl-dist

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  build:
    name: build and verify
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = ([string]$env:INPUT_VERSION).Trim()
          if (-not $version) { $version = (Get-Content -LiteralPath VERSION -Raw).Trim() }
          if ($version.StartsWith('v') -or $version.StartsWith('V')) { $version = $version.Substring(1) }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.\-]*)?$') {
              throw "Unsupported version '$version'. Use x.y.z with an optional -suffix."
          }
          $line = "value=$version"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, $line + "`n", (New-Object Text.UTF8Encoding($false)))
          Write-Host "version: $version"

      - name: Offline unit tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\Run-Tests.ps1 -Offline

      - name: Mock API and download tests
        run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\Run-MockTests.ps1 -NoUi

      - name: Build artifact
        run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File .\Compile.ps1 -NoVersionBump -Version "${{ steps.version.outputs.value }}"

      - name: Verify artifact
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'GitHubLauncher.ps1'
          if (-not (Test-Path -LiteralPath $path)) { throw 'GitHubLauncher.ps1 was not produced.' }

          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 150000) { throw "artifact is suspiciously small: $($bytes.Length) bytes" }
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw 'artifact starts with a UTF-8 BOM - irm | iex would break.'
          }
          $nonAscii = @($bytes | Where-Object { $_ -gt 0x7F })
          if ($nonAscii.Count -gt 0) { throw "artifact contains $($nonAscii.Count) non-ASCII byte(s)." }

          $text = [IO.File]::ReadAllText($path)
          if ($text -notmatch [regex]::Escape("Version = '$($env:EXPECTED_VERSION)'")) {
              throw "artifact does not embed version $($env:EXPECTED_VERSION)."
          }
          $fromFile = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'VERSION') -Raw).Trim()
          if ($fromFile -ne $env:EXPECTED_VERSION) {
              throw "VERSION says '$fromFile' but the build stamped '$($env:EXPECTED_VERSION)'."
          }
          Write-Host ('artifact ok: {0} KB, version {1}' -f [Math]::Round($bytes.Length / 1KB, 1), $env:EXPECTED_VERSION)

      - name: Assemble distribution
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'GitHubLauncher.ps1') -Destination (Join-Path $dist 'GitHubLauncher.ps1') -Force
          # the Pages copy: same bytes, no extension, so `irm <pages>/gl` works
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'GitHubLauncher.ps1') -Destination (Join-Path $dist 'gl') -Force

          $named = (Get-FileHash -LiteralPath (Join-Path $dist 'GitHubLauncher.ps1') -Algorithm SHA256).Hash.ToLowerInvariant()
          $plain = (Get-FileHash -LiteralPath (Join-Path $dist 'gl') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($named -ne $plain) { throw 'dist/GitHubLauncher.ps1 and dist/gl differ.' }

          $sums = @("$named  GitHubLauncher.ps1", "$plain  gl", '') -join "`n"
          [IO.File]::WriteAllText((Join-Path $dist 'SHA256SUMS.txt'), $sums, (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem -LiteralPath $dist | ForEach-Object { Write-Host ("  {0}  {1} KB" -f $_.Name, [Math]::Round($_.Length / 1KB, 1)) }

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: ghl-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $sum = @(
            '### GitHub Launcher build',
            '',
            "- version: ``$($env:EXPECTED_VERSION)``",
            '- artifact: `dist/GitHubLauncher.ps1` and extensionless `dist/gl`',
            '- gates: offline unit tests, mock API/download tests, ASCII + no-BOM check',
            ''
          ) -join "`n"
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $sum, (New-Object Text.UTF8Encoding($false)))